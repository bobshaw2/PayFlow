<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PayFlow reconciliation dashboard preview</title><desc id="desc">A blue payment reconciliation dashboard with summary cards and a transaction table.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eaf2ff"/><stop offset="1" stop-color="#f5f8fc"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1a3850" flood-opacity=".15"/></filter></defs>
  <rect width="1200" height="675" rx="24" fill="url(#bg)"/>
  <rect x="35" y="35" width="1130" height="605" rx="18" fill="#fff" filter="url(#shadow)"/>
  <path d="M35 53a18 18 0 0 1 18-18h1094a18 18 0 0 1 18 18v74H35z" fill="#152b49"/>
  <circle cx="77" cy="72" r="14" fill="#6bd5bf"/><path d="M77 62v20M67 72h20" stroke="#152b49" stroke-width="3"/><text x="104" y="80" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">PayFlow</text><text x="1000" y="78" fill="#d8e5f4" font-family="Arial, sans-serif" font-size="16">Hi, demo_user</text>
  <text x="76" y="151" fill="#2077f1" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">RECONCILIATION DASHBOARD</text><text x="76" y="190" fill="#152b49" font-family="Arial, sans-serif" font-size="31" font-weight="700">Keep every payment in sync.</text><text x="76" y="217" fill="#58708e" font-family="Arial, sans-serif" font-size="16">Compare your merchant records with your payment-provider export.</text>
  <g font-family="Arial, sans-serif"><rect x="76" y="246" width="245" height="108" rx="10" fill="#fff" stroke="#dce4ee"/><rect x="76" y="246" width="5" height="108" rx="3" fill="#2077f1"/><text x="100" y="276" fill="#647a94" font-size="14">Merchant records</text><text x="100" y="316" fill="#152b49" font-size="32" font-weight="700">7</text><text x="100" y="338" fill="#647a94" font-size="13">$377.74 total</text>
  <rect x="340" y="246" width="245" height="108" rx="10" fill="#fff" stroke="#dce4ee"/><rect x="340" y="246" width="5" height="108" rx="3" fill="#25a781"/><text x="364" y="276" fill="#647a94" font-size="14">Matched</text><text x="364" y="316" fill="#152b49" font-size="32" font-weight="700">3</text><text x="364" y="338" fill="#647a94" font-size="13">Ready to settle</text>
  <rect x="604" y="246" width="245" height="108" rx="10" fill="#fff" stroke="#dce4ee"/><rect x="604" y="246" width="5" height="108" rx="3" fill="#ed9b39"/><text x="628" y="276" fill="#647a94" font-size="14">Needs review</text><text x="628" y="316" fill="#152b49" font-size="32" font-weight="700">4</text><text x="628" y="338" fill="#647a94" font-size="13">1 duplicate ID</text></g>
  <rect x="76" y="385" width="1014" height="207" rx="10" fill="#fff" stroke="#dce4ee"/><text x="100" y="422" fill="#152b49" font-family="Arial, sans-serif" font-size="21" font-weight="700">Transaction results</text><rect x="768" y="398" width="160" height="30" rx="5" fill="#fff" stroke="#bac9da"/><text x="784" y="418" fill="#8a9aae" font-family="Arial, sans-serif" font-size="12">Search transactions</text><rect x="942" y="398" width="124" height="30" rx="5" fill="#fff" stroke="#bac9da"/><text x="957" y="418" fill="#58708e" font-family="Arial, sans-serif" font-size="12">All statuses ▾</text>
  <rect x="77" y="444" width="1012" height="34" fill="#f6f9fc"/><g fill="#60748c" font-family="Arial, sans-serif" font-size="11" font-weight="700"><text x="100" y="466">TRANSACTION ID</text><text x="290" y="466">MERCHANT</text><text x="415" y="466">PROVIDER</text><text x="555" y="466">DATE</text><text x="694" y="466">STATUS</text><text x="838" y="466">DETAILS</text></g>
  <g font-family="Arial, sans-serif" font-size="13"><text x="100" y="506" fill="#152b49" font-weight="700">TXN-1001</text><text x="290" y="506" fill="#26384f">49.99</text><text x="415" y="506" fill="#26384f">49.99</text><text x="555" y="506" fill="#26384f">2026-09-15</text><rect x="694" y="488" width="67" height="23" rx="12" fill="#dff7ee"/><text x="706" y="504" fill="#087b5b" font-size="11" font-weight="700">Matched</text><text x="838" y="506" fill="#58708e">Transaction reconciled</text>
